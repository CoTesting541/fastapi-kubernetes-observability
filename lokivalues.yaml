deploymentMode: SimpleScalable

loki:
  common:
    path_prefix: /var/loki
    replication_factor: 2

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  ingester:
    chunk_encoding: snappy
    lifecycler:
      ring:
        kvstore:
          store: memberlist
        replication_factor: 2

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

  querier:
    max_concurrent: 2

  pattern_ingester:
    enabled: true

# -------------------------
# SCALE OUT COMPONENTS
# -------------------------

write:
  replicas: 2

read:
  replicas: 2

backend:
  replicas: 2

# -------------------------
# STORAGE (local dev: MinIO)
# -------------------------

minio:
  enabled: true

# -------------------------
# CACHE (optional but fine disabled for k3d)
# -------------------------

chunksCache:
  enabled: false

resultsCache:
  enabled: false

# -------------------------
# GATEWAY
# -------------------------

gateway:
  service:
    type: LoadBalancer
